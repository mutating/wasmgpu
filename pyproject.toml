[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wasmgpu"
version = "0.0.1"
authors = [
  { name="Evgeniy Blinov", email="zheni-b@yandex.ru" },
]
description = 'Batched WebAssembly compilation and execution on hardware GPUs'
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "wgpu==0.18.0; python_version < '3.9'",
    "wgpu==0.24.0; python_version >= '3.9' and python_version < '3.10'",
    "wgpu==0.31.0; python_version >= '3.10' and python_version < '3.11'",
    "wgpu==0.32.0; python_version >= '3.11'",
]
classifiers = [
    "Operating System :: OS Independent",
    'Operating System :: MacOS :: MacOS X',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Free Threading',
    'License :: OSI Approved :: MIT License',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed',
]
keywords = [
    'WASM',
]

[tool.setuptools.package-data]
"wasmgpu" = ["py.typed", "*.wgsl"]

[tool.setuptools.packages.find]
include = ["wasmgpu*"]

[tool.mutmut]
paths_to_mutate=["wasmgpu"]

[tool.coverage.run]
branch = "${WASMGPU_COVERAGE_BRANCH-false}"
omit = ["*tests*"]
parallel = true
plugins = ["coverage_pyver_pragma"]
source = ["wasmgpu"]

[tool.pytest.ini_options]
norecursedirs = ["build", "mutants"]
markers = ["gpu: requires a real hardware GPU; never uses a software adapter"]

[tool.ruff]
lint.ignore = ['E501', 'E712', 'PTH123', 'PTH118', 'PLR2004', 'PTH107', 'SIM105', 'SIM102', 'RET503', 'PLR0912', 'C901', 'E731', 'F821']
lint.select = ["ERA001", "YTT", "ASYNC", "BLE", "B", "A", "COM", "INP", "PIE", "T20", "PT", "RSE", "RET", "SIM", "SLOT", "TID252", "ARG", "PTH", "I", "C90", "N", "E", "W", "D201", "D202", "D419", "F", "PL", "PLE", "PLR", "PLW", "RUF", "TRY201", "TRY400", "TRY401"]
lint.isort.combine-as-imports = true
format.quote-style = "single"

[project.urls]
'Source' = 'https://github.com/mutating/wasmgpu'
'Tracker' = 'https://github.com/mutating/wasmgpu/issues'
